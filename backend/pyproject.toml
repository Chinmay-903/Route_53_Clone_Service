[project]
name = "route53-clone-api"
version = "0.1.0"
description = "API for a functional clone of the AWS Route 53 console."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "pydantic>=2.10.4",
    # Backs Pydantic's EmailStr, which is not usable without it.
    "email-validator>=2.2.0",
    "pydantic-settings>=2.7.0",
    "argon2-cffi>=23.1.0",
    "python-multipart>=0.0.20",
    "slowapi>=0.1.9",
    "structlog>=24.4.0",
    "idna>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.1",
    "ruff>=0.8.4",
    "mypy>=1.14.0",
    "pip-audit>=2.7.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",             # import sorting
    "N",             # pep8-naming
    "UP",            # pyupgrade
    "B",             # bugbear
    "S",             # bandit security checks
    "C4",            # comprehensions
    "SIM",           # simplification
    "PL",            # pylint subset
    "RUF",
    "D",             # docstrings — Part 3 requires them on every public symbol
]
ignore = [
    "D203",   # conflicts with D211, which we keep
    "D213",   # conflicts with D212, which we keep
    # FastAPI endpoints and service constructors legitimately declare many
    # parameters; the framework always supplies them by name, so positional
    # argument counts are not a readability signal here.
    "PLR0913",
    "PLR0917",
    # Arity checks such as `len(parts) != 2` sit directly beside an error
    # message stating the expected format. A named constant would add
    # indirection without adding clarity.
    "PLR2004",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert on internals and use hardcoded fixture passwords by design.
# Imports are deliberately deferred inside fixtures so environment variables are
# in place before anything under `app` is imported.
"tests/*" = ["D", "S101", "S105", "S106", "PLC0415"]
"alembic/*" = ["D", "N999"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["slowapi.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
